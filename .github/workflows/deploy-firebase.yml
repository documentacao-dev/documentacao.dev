name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # jaspr_web_compilers 4.x só aceita Dart < 3.11. O Flutter stable já
      # traz Dart 3.14, então fixamos o SDK do Dart e a CLI na mesma linha do
      # jaspr usado no pubspec (0.21.x) até migrar o site para o jaspr 0.23.
      # O jaspr_web_compilers 4.x compila com o SDK web do Flutter.
      # Vem antes do setup-dart para o Dart 3.10.9 ficar na frente no PATH.
      - name: Setup Flutter (SDK web)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.9'

      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli 0.21.7

      - name: Get dependencies
        working-directory: ./src
        run: dart pub get

      - name: Clean build cache
        working-directory: ./src
        run: |
          # Clean any stale build artifacts
          rm -rf .dart_tool/build
          rm -rf build

      - name: Build Jaspr project
        working-directory: ./src
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          jaspr build --verbose

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: transliteradu
          channelId: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'live' }}
          entryPoint: ./src
